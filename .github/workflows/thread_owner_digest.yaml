name: thread-user-digest

on:
  schedule:
    - cron: "10 23 * * *" # 08:10 JST
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target date in JST (YYYY-MM-DD). Empty means yesterday."
        required: false
        type: string
      dry_run:
        description: "If true, skip Discord posting and print report only."
        required: true
        default: false
        type: boolean

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install openai

      - name: Check OpenAI secret presence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          key = os.getenv("OPENAI_API_KEY", "")
          print(f"OPENAI_API_KEY is set: {bool(key)}")
          print(f"OPENAI_API_KEY length: {len(key)}")
          if not key:
              print("OPENAI_API_KEY is missing. The digest will run in rule-only mode.")
          PY

      - name: Check OpenAI auth
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          key = os.getenv("OPENAI_API_KEY", "").strip()
          if not key:
              print("OpenAI auth check skipped (OPENAI_API_KEY is not set).")
              sys.exit(0)

          from openai import OpenAI
          try:
              client = OpenAI(api_key=key, timeout=20)
              client.models.list()
              print("OpenAI auth check: OK")
          except Exception as exc:
              print(f"OpenAI auth check: NG ({exc})")
              sys.exit(1)
          PY

      - name: Run digest (schedule)
        if: github.event_name == 'schedule'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_FORUM_CHANNEL_IDS: ${{ secrets.DISCORD_FORUM_CHANNEL_IDS }}
          DISCORD_FORUM_CHANNEL_ID: ${{ secrets.DISCORD_FORUM_CHANNEL_ID }}
          DISCORD_TARGET_USER_ID: ${{ secrets.DISCORD_TARGET_USER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_REPORT_THREAD_ID: ${{ secrets.DISCORD_REPORT_THREAD_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          LLM_MAX_FALLBACK_MESSAGES: ${{ vars.LLM_MAX_FALLBACK_MESSAGES }}
          LLM_TIMEOUT_SECONDS: ${{ vars.LLM_TIMEOUT_SECONDS }}
          DRY_RUN: "false"
          OUTPUT_DIR: artifacts
        run: python3 scripts/collect_thread_owner_stats.py

      - name: Run digest (manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_FORUM_CHANNEL_IDS: ${{ secrets.DISCORD_FORUM_CHANNEL_IDS }}
          DISCORD_FORUM_CHANNEL_ID: ${{ secrets.DISCORD_FORUM_CHANNEL_ID }}
          DISCORD_TARGET_USER_ID: ${{ secrets.DISCORD_TARGET_USER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_REPORT_THREAD_ID: ${{ secrets.DISCORD_REPORT_THREAD_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          LLM_MAX_FALLBACK_MESSAGES: ${{ vars.LLM_MAX_FALLBACK_MESSAGES }}
          LLM_TIMEOUT_SECONDS: ${{ vars.LLM_TIMEOUT_SECONDS }}
          TARGET_DATE: ${{ inputs.target_date }}
          DRY_RUN: ${{ inputs.dry_run }}
          OUTPUT_DIR: artifacts
        run: python3 scripts/collect_thread_owner_stats.py

      - name: Upload digest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thread-user-digest-${{ github.run_id }}
          path: |
            artifacts/*.json
            artifacts/*.sqlite3
          if-no-files-found: warn
